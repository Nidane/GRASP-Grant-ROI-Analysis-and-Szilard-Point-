<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GRASP — Grant ROI Analysis and Szilard Point Platform</title>
    <script>
      // GitHub Pages SPA redirect:
      // Any 404 from GitHub Pages gets redirected straight to the app root.
      // Since GRASP is a single-page app with only one route (/),
      // we simply redirect to the base URL of the repository.
      var pathSegments = window.location.pathname.split('/');
      // pathSegments[1] is the repo name, e.g. "GRASP-Grant-ROI-Analysis-and-Szilard-Point-"
      var repoBase = '/' + pathSegments[1] + '/';
      window.location.replace(
        window.location.protocol + '//' + window.location.host + repoBase
      );
    </script>
  </head>
  <body>
    <style>body{margin:0;background:#0d1117;}</style>
  </body>
</html>
